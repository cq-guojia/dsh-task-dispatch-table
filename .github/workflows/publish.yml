name: Publish to npm

# 触发：推送形如 v* 的 tag 时，自动发布到 npm。
# 信任发布（OIDC）下无需 NPM_TOKEN；provenance 自动生成。
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # 必需：供 npm 通过 OIDC 做信任发布
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      # npm 信任发布已勾选「Allow npm publish」，OIDC 直接发布，无需人工审批。
      - run: npm publish
