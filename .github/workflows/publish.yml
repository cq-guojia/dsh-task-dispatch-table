name: Publish to npm

# 触发：推送形如 v* 的 tag 时，自动发布到 npm。
# 信任发布（OIDC）下无需 NPM_TOKEN；provenance 自动生成。
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # 必需：供 npm 通过 OIDC 做信任发布
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 依赖一律 pnpm：版本读 package.json 的 packageManager，锁文件为 pnpm-lock.yaml。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # 必须 npm 11.5.1+，否则无 OIDC 支持 → 404
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: node --version && npm --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # npm 信任发布已勾选「Allow npm publish」：npm 11+ 自动走 OIDC，无需 NPM_TOKEN。
      - run: npm publish --provenance
